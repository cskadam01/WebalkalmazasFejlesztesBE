name: Temporary BabaEllatas 1.6 Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baba-v16-build
      - name: Restore v1.5 and apply v1.6
        run: |
          cat baba-v13-src/part00 baba-v13-src/part01 baba-v13-src/part02 baba-v13-src/part03 baba-v13-src/part04 baba-v13-src/part05 baba-v13-src/part06 baba-v13-src/part07 > baba-v13-source.b64
          base64 -d baba-v13-source.b64 > baba-v13-source.zip
          rm -rf baba-v16-build-dir
          mkdir baba-v16-build-dir
          unzip -q baba-v13-source.zip -d baba-v16-build-dir
          cat baba-v14-patch/main_00.txt baba-v14-patch/main_01.txt baba-v14-patch/main_02.txt baba-v14-patch/main_03.txt baba-v14-patch/main_04.txt baba-v14-patch/main_05.txt baba-v14-patch/main_06.txt > baba-v16-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
          cat baba-v14-patch/openai_00.txt baba-v14-patch/openai_01.txt baba-v14-patch/openai_02.txt > baba-v16-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
          cp baba-v14-patch/build.gradle baba-v16-build-dir/app/build.gradle
          cat baba-v15-patch/part00.diff baba-v15-patch/part01.diff baba-v15-patch/part02.diff baba-v15-patch/part03.diff > /tmp/v15.patch
          cd baba-v16-build-dir
          patch -p1 < /tmp/v15.patch
          patch -p1 < ../baba-v15-patch/fix01.diff
          cd ..
          base64 -d baba-v16/v16patch.gz.b64 | gunzip > /tmp/v16.patch
          cd baba-v16-build-dir
          patch -p1 < /tmp/v16.patch
          grep -q "versionCode 7" app/build.gradle
          grep -q "versionName '1.6.0'" app/build.gradle
          grep -q "NEM CSED-maximum" app/src/main/java/hu/babatamogatas/app/CalculatorEngine.java
          grep -q "withDayOfMonth(1).minusMonths(2).minusDays(1)" app/src/main/java/hu/babatamogatas/app/CalculatorEngine.java
          grep -q "Jogviszonyonkénti számítás" app/src/main/java/hu/babatamogatas/app/MainActivity.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Engine regression tests
        run: |
          mkdir -p baba-v16-build-dir/engine-test/out
          javac -d baba-v16-build-dir/engine-test/out \
            baba-v16-build-dir/app/src/main/java/hu/babatamogatas/app/EmploymentPeriod.java \
            baba-v16-build-dir/app/src/main/java/hu/babatamogatas/app/CalculationResult.java \
            baba-v16-build-dir/app/src/main/java/hu/babatamogatas/app/CalculatorEngine.java \
            baba-v16-build-dir/engine-test/TestCalculator.java
          java -cp baba-v16-build-dir/engine-test/out TestCalculator
      - name: Build APK
        run: cd baba-v16-build-dir && gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f baba-v16-build-dir/app/build/outputs/apk/debug/app-debug.apk
          unzip -t baba-v16-build-dir/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -l baba-v16-build-dir/app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          sha256sum baba-v16-build-dir/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BabaEllatas-2026-v1.6-apk
          path: baba-v16-build-dir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
