name: Temporary BabaEllatas APK Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/baba-temp-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "baba-app/**"
      - ".github/workflows/baba-temp-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baba-apk-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: cd baba-app && gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f baba-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t baba-app/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum baba-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BabaEllatas-2026-apk
          path: baba-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
