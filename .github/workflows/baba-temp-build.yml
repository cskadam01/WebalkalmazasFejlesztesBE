name: Temporary BabaEllatas APK Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/baba-temp-build.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baba-apk-build
      - name: Restore source
        run: |
          cat baba-v11-b64/part00 baba-v11-b64/part01 baba-v11-b64/part02 baba-v11-b64/part03 baba-v11-b64/part04 baba-v11-b64/part05 baba-v11-b64/p06_0 baba-v11-b64/p06_1 baba-v11-b64/part07 > baba-v11-source.b64
          base64 -d baba-v11-source.b64 > baba-v11-source.zip
          unzip -t baba-v11-source.zip
          rm -rf baba-v11-build
          mkdir baba-v11-build
          unzip -q baba-v11-source.zip -d baba-v11-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: cd baba-v11-build && gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f baba-v11-build/app/build/outputs/apk/debug/app-debug.apk
          unzip -t baba-v11-build/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum baba-v11-build/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BabaEllatas-2026-v1.1-apk
          path: baba-v11-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
