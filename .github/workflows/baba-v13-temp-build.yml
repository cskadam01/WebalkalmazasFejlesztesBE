name: Temporary BabaEllatas 1.3 Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baba-v13-build
      - name: Restore source
        run: |
          cat baba-v13-src/part00 baba-v13-src/part01 baba-v13-src/part02 baba-v13-src/part03 baba-v13-src/part04 baba-v13-src/part05 baba-v13-src/part06 baba-v13-src/part07 > baba-v13-source.b64
          base64 -d baba-v13-source.b64 > baba-v13-source.zip
          unzip -t baba-v13-source.zip
          rm -rf baba-v13-build-dir
          mkdir baba-v13-build-dir
          unzip -q baba-v13-source.zip -d baba-v13-build-dir
          grep -q "versionName '1.3.0'" baba-v13-build-dir/app/build.gradle
          grep -q "MEGBIZASI_SZERZODES" baba-v13-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
          grep -q "input_image" baba-v13-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
          grep -q "TAPPENZ_IGAZOLAS" baba-v13-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
          grep -q "365 nap" baba-v13-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: cd baba-v13-build-dir && gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f baba-v13-build-dir/app/build/outputs/apk/debug/app-debug.apk
          unzip -t baba-v13-build-dir/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -l baba-v13-build-dir/app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          sha256sum baba-v13-build-dir/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BabaEllatas-2026-v1.3-apk
          path: baba-v13-build-dir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
