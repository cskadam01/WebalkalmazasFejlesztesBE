name: Temporary BabaEllatas 1.7 Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baba-v17-build
      - name: Restore v1.6 and apply v1.7 insurance fix
        run: |
          cat baba-v13-src/part00 baba-v13-src/part01 baba-v13-src/part02 baba-v13-src/part03 baba-v13-src/part04 baba-v13-src/part05 baba-v13-src/part06 baba-v13-src/part07 > baba-v13-source.b64
          base64 -d baba-v13-source.b64 > baba-v13-source.zip
          rm -rf baba-v17-build-dir
          mkdir baba-v17-build-dir
          unzip -q baba-v13-source.zip -d baba-v17-build-dir
          cat baba-v14-patch/main_00.txt baba-v14-patch/main_01.txt baba-v14-patch/main_02.txt baba-v14-patch/main_03.txt baba-v14-patch/main_04.txt baba-v14-patch/main_05.txt baba-v14-patch/main_06.txt > baba-v17-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
          cat baba-v14-patch/openai_00.txt baba-v14-patch/openai_01.txt baba-v14-patch/openai_02.txt > baba-v17-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
          cp baba-v14-patch/build.gradle baba-v17-build-dir/app/build.gradle
          cat baba-v15-patch/part00.diff baba-v15-patch/part01.diff baba-v15-patch/part02.diff baba-v15-patch/part03.diff > /tmp/v15.patch
          cd baba-v17-build-dir
          patch -p1 < /tmp/v15.patch
          patch -p1 < ../baba-v15-patch/fix01.diff
          cd ..
          base64 -d baba-v16/v16patch.gz.b64 | gunzip > /tmp/v16.patch
          cd baba-v17-build-dir
          patch -p1 < /tmp/v16.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 7','versionCode 8').replace("versionName '1.6.0'","versionName '1.7.0'")
          p.write_text(s)

          e=Path('app/src/main/java/hu/babatamogatas/app/CalculatorEngine.java')
          s=e.read_text()
          s=s.replace('if (!p.insured || !relationshipKey(p).equals(key) || p.monthlyGross <= 0) continue;', 'if (!isInsuredPeriod(p) || !relationshipKey(p).equals(key) || p.monthlyGross <= 0) continue;')
          s=s.replace('if (!p.insured || p.start == null || p.start.isAfter(entitlement.minusDays(1))) continue;', 'if (!isInsuredPeriod(p) || p.start == null || p.start.isAfter(entitlement.minusDays(1))) continue;')
          s=s.replace('if (!p.insured || p.start == null) continue;', 'if (!isInsuredPeriod(p) || p.start == null) continue;')
          s=s.replace('if (!p.insured || p.end == null) continue;', 'if (!isInsuredPeriod(p) || p.end == null) continue;')
          s=s.replace('if (p.insured && p.end != null && !p.end.isBefore(date.minusDays(168)) && p.end.isBefore(date)) keys.add(relationshipKey(p));', 'if (isInsuredPeriod(p) && p.end != null && !p.end.isBefore(date.minusDays(168)) && p.end.isBefore(date)) keys.add(relationshipKey(p));')
          needle='    private static String relationshipKey(EmploymentPeriod p) {'
          helper='''    public static boolean isInsuredPeriod(EmploymentPeriod p) {\n        if (p == null || p.start == null) return false;\n        String t = p.relationType == null ? "" : p.relationType.trim().toLowerCase(Locale.ROOT);\n        if (t.equals("munkaviszony") || t.contains("munkaviszony")) return true;\n        if (t.contains("tartós megbíz") || t.contains("tartos megbiz")) return p.start.getYear() >= 2026 || p.insured;\n        if (t.contains("normál megbíz") || t.contains("normal megbiz") || t.equals("megbízás") || t.equals("megbizas")) {\n            if (p.insured) return true;\n            return p.monthlyGross > 0 && normalMandateLikelyInsured(p.start, p.monthlyGross);\n        }\n        if (t.contains("munkavégzésre irányuló egyéb") || t.contains("munkavegzesre iranyulo egyeb")) {\n            if (p.insured) return true;\n            return p.monthlyGross > 0 && normalMandateLikelyInsured(p.start, p.monthlyGross);\n        }\n        return p.insured;\n    }\n\n'''
          if 'public static boolean isInsuredPeriod' not in s:
              s=s.replace(needle,helper+needle)
          e.write_text(s)

          m=Path('app/src/main/java/hu/babatamogatas/app/MainActivity.java')
          s=m.read_text()
          s=s.replace('boolean insured="igen".equals(e.insuredStatus)||e.insuranceEvidence||"Tartós megbízás".equals(rel);', 'boolean insured="igen".equals(e.insuredStatus)||e.insuranceEvidence||"Munkaviszony".equals(rel)||"Tartós megbízás".equals(rel);')
          s=s.replace('boolean ins=state.insured.isChecked();if("Tartós megbízás".equals(rel))ins=true;', 'boolean ins=state.insured.isChecked();if("Munkaviszony".equals(rel)||"Tartós megbízás".equals(rel))ins=true;')
          m.write_text(s)
          PY
          grep -q "versionCode 8" app/build.gradle
          grep -q "versionName '1.7.0'" app/build.gradle
          grep -q "public static boolean isInsuredPeriod" app/src/main/java/hu/babatamogatas/app/CalculatorEngine.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Full calculation regression tests
        run: |
          cat > /tmp/TestCalculatorV17.java <<'JAVA'
          import hu.babatamogatas.app.*;
          import java.time.*;
          import java.util.*;
          public class TestCalculatorV17 {
            static void eq(long a,long b,String m){if(a!=b)throw new RuntimeException(m+": "+a+" != "+b);}
            static void ok(boolean x,String m){if(!x)throw new RuntimeException(m);}
            public static void main(String[] args){
              LocalDate birth=LocalDate.of(2027,1,27);
              EmploymentPeriod recent=new EmploymentPeriod("Omega","Munkaviszony",LocalDate.of(2026,8,24),null,749200,false,0,0,List.of("MUNKASZERZODES"));
              CalculationResult r1=CalculatorEngine.calculate(birth,false,List.of(recent),false,false);
              eq(r1.insuredDaysInTwoYears,156,"screenshot insurance days");
              ok(r1.csedGrossMonthly>0,"screenshot CSED must not be zero");
              EmploymentPeriod longJob=new EmploymentPeriod("Long","Munkaviszony",LocalDate.of(2025,1,1),null,900000,false,0,0,List.of("NAV"));
              CalculationResult r2=CalculatorEngine.calculate(birth,false,List.of(longJob),false,false);
              ok(r2.insurance365Met,"365-day eligibility");
              ok(r2.csedEligible,"CSED eligible");
              ok(r2.gyedEligible,"GYED eligible");
              ok(r2.csedGrossMonthly>645600,"CSED must exceed false cap when income supports it");
              eq(r2.gyedGrossMonthly,451920,"GYED 2026 max");
              EmploymentPeriod oldJob=new EmploymentPeriod("A","Munkaviszony",LocalDate.of(2025,1,1),LocalDate.of(2026,7,31),650000,false,0,0,List.of("NAV"));
              EmploymentPeriod newJob=new EmploymentPeriod("B","Munkaviszony",LocalDate.of(2026,8,10),null,800000,false,0,0,List.of("NAV"));
              CalculationResult r3=CalculatorEngine.calculate(birth,false,List.of(oldJob,newJob),false,false);
              ok(r3.insurance365Met,"employer change insurance continuity");
              EmploymentPeriod low=new EmploymentPeriod("M","Normál megbízás",LocalDate.of(2026,1,1),null,50000,false,0,0,List.of("MEGBIZAS"));
              ok(!CalculatorEngine.isInsuredPeriod(low),"low mandate threshold");
              EmploymentPeriod high=new EmploymentPeriod("M","Normál megbízás",LocalDate.of(2026,1,1),null,120000,false,0,0,List.of("MEGBIZAS"));
              ok(CalculatorEngine.isInsuredPeriod(high),"high mandate threshold");
              System.out.println("ALL_V17_TESTS_OK days="+r1.insuredDaysInTwoYears+" csed="+r1.csedGrossMonthly+" longCsed="+r2.csedGrossMonthly);
            }
          }
          JAVA
          mkdir -p /tmp/v17out
          javac -d /tmp/v17out baba-v17-build-dir/app/src/main/java/hu/babatamogatas/app/EmploymentPeriod.java baba-v17-build-dir/app/src/main/java/hu/babatamogatas/app/CalculationResult.java baba-v17-build-dir/app/src/main/java/hu/babatamogatas/app/CalculatorEngine.java /tmp/TestCalculatorV17.java
          java -cp /tmp/v17out TestCalculatorV17
      - name: Build APK
        run: cd baba-v17-build-dir && gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f baba-v17-build-dir/app/build/outputs/apk/debug/app-debug.apk
          unzip -t baba-v17-build-dir/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -l baba-v17-build-dir/app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          sha256sum baba-v17-build-dir/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BabaEllatas-2026-v1.7-apk
          path: baba-v17-build-dir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
