name: Temporary BabaEllatas 1.2 Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baba-v12-build
      - name: Restore 1.1 source
        run: |
          cat baba-v11-b64/part00 baba-v11-b64/part01 baba-v11-b64/part02 baba-v11-b64/part03 baba-v11-b64/part04 baba-v11-b64/part05 baba-v11-b64/p06_0 baba-v11-b64/p06_1 baba-v11-b64/part07 > baba-v11-source.b64
          base64 -d baba-v11-source.b64 > baba-v11-source.zip
          unzip -t baba-v11-source.zip
          rm -rf baba-v12-build-dir
          mkdir baba-v12-build-dir
          unzip -q baba-v11-source.zip -d baba-v12-build-dir
      - name: Apply 1.2 source changes
        run: |
          cat baba-v12-patch/main_0.txt baba-v12-patch/main_1.txt baba-v12-patch/main_2.txt baba-v12-patch/main_3.txt baba-v12-patch/main_4.txt > baba-v12-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
          cat baba-v12-patch/openai_0.txt baba-v12-patch/openai_1.txt > baba-v12-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
          cp baba-v12-patch/build.gradle baba-v12-build-dir/app/build.gradle
          grep -q "versionName '1.2.0'" baba-v12-build-dir/app/build.gradle
          grep -q "Munkaszerződés betöltése AI-val" baba-v12-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
          grep -q "Szerkesztés" baba-v12-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: cd baba-v12-build-dir && gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f baba-v12-build-dir/app/build/outputs/apk/debug/app-debug.apk
          unzip -t baba-v12-build-dir/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -l baba-v12-build-dir/app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          sha256sum baba-v12-build-dir/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BabaEllatas-2026-v1.2-apk
          path: baba-v12-build-dir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
