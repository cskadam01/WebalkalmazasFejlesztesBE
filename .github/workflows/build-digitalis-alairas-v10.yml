name: Digitalis Alairasgyujto V10 Android APK
on:
  push:
    branches: ['temp/digitalis-alairasgyujto-v10-20261107']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Kotlin Android V10 project
        run: unzip -o digitalis-alairas-v10-source.zip -d .
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find hosted Android SDK
        shell: bash
        run: |
          set -eu
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Android SDK API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile signed debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify final APK
        shell: bash
        run: |
          set -eu
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > SHA256_APK.txt
      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Digitalis_Alairasgyujto_V10_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256_APK.txt
          if-no-files-found: error
          retention-days: 7
