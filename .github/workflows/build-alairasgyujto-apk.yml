name: Android APK Build - Alairasgyujto

on:
  push:
    branches: [ 'temp/digitalis-alairasgyujto-apk-20261107' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Extract isolated app source
        run: unzip -o android-project-source.zip -d .
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use hosted Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and signature
        shell: bash
        run: |
          set -eu
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > APK_SHA256.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Digitalis_Alairasgyujto_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 7
