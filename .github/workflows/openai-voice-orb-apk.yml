name: Build OpenAI Voice Orb APK

on:
  push:
    branches:
      - openai-voice-orb-apk-build-20260915
    paths:
      - 'openai-voice-orb/**'
      - '.github/workflows/openai-voice-orb-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openai-voice-orb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAIVoiceOrb-debug-apk
          path: openai-voice-orb/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
