name: Temporary BabaEllatas 1.4 Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baba-v14-build
      - name: Restore v1.3 source and apply v1.4
        run: |
          cat baba-v13-src/part00 baba-v13-src/part01 baba-v13-src/part02 baba-v13-src/part03 baba-v13-src/part04 baba-v13-src/part05 baba-v13-src/part06 baba-v13-src/part07 > baba-v13-source.b64
          base64 -d baba-v13-source.b64 > baba-v13-source.zip
          unzip -t baba-v13-source.zip
          rm -rf baba-v14-build-dir
          mkdir baba-v14-build-dir
          unzip -q baba-v13-source.zip -d baba-v14-build-dir
          cat baba-v14-patch/main_00.txt baba-v14-patch/main_01.txt baba-v14-patch/main_02.txt baba-v14-patch/main_03.txt baba-v14-patch/main_04.txt baba-v14-patch/main_05.txt baba-v14-patch/main_06.txt > baba-v14-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
          cat baba-v14-patch/openai_00.txt baba-v14-patch/openai_01.txt baba-v14-patch/openai_02.txt > baba-v14-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
          cp baba-v14-patch/build.gradle baba-v14-build-dir/app/build.gradle
          grep -q "versionName '1.4.0'" baba-v14-build-dir/app/build.gradle
          grep -q "AI teljes import" baba-v14-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
          grep -q "EXTRA_ALLOW_MULTIPLE" baba-v14-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
          grep -q "Kiegészítő információ az AI-nak" baba-v14-build-dir/app/src/main/java/hu/babatamogatas/app/MainActivity.java
          grep -q "extractEmploymentBatch" baba-v14-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
          grep -q "input_image" baba-v14-build-dir/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: cd baba-v14-build-dir && gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f baba-v14-build-dir/app/build/outputs/apk/debug/app-debug.apk
          unzip -t baba-v14-build-dir/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -l baba-v14-build-dir/app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          sha256sum baba-v14-build-dir/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BabaEllatas-2026-v1.4-apk
          path: baba-v14-build-dir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
