name: Build BabaEllatas v1.10 APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract v1.10 source
        shell: bash
        run: |
          unzip -t baba-v110-source.zip
          rm -rf /tmp/baba-v110-src
          mkdir -p /tmp/baba-v110-src
          unzip -q baba-v110-source.zip -d /tmp/baba-v110-src
          grep -q "versionName '1.10.0'" /tmp/baba-v110-src/app/build.gradle
          test -f /tmp/baba-v110-src/app/src/main/java/hu/babatamogatas/app/EmploymentImportNormalizer.java
          grep -q "auditPrompt" /tmp/baba-v110-src/app/src/main/java/hu/babatamogatas/app/OpenAIClient.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run calculation and import regression tests
        working-directory: /tmp/baba-v110-src
        shell: bash
        run: |
          rm -rf /tmp/baba-v110-tests && mkdir -p /tmp/baba-v110-tests
          javac -d /tmp/baba-v110-tests app/src/main/java/hu/babatamogatas/app/EmploymentPeriod.java app/src/main/java/hu/babatamogatas/app/CalculationResult.java app/src/main/java/hu/babatamogatas/app/CalculatorEngine.java app/src/main/java/hu/babatamogatas/app/EmploymentImportNormalizer.java engine-test/TestCalculatorV18.java engine-test/TestCalculatorV19.java engine-test/TestImportNormalizer.java
          java -cp /tmp/baba-v110-tests TestCalculatorV18
          java -cp /tmp/baba-v110-tests TestCalculatorV19
          java -cp /tmp/baba-v110-tests TestImportNormalizer

      - name: Build debug APK
        working-directory: /tmp/baba-v110-src
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find /tmp/baba-v110-src/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          file "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee /tmp/BabaEllatas-v1.10.sha256
          cp "$APK" /tmp/BabaEllatas-2026-v1.10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BabaEllatas-2026-v1.10-APK
          path: |
            /tmp/BabaEllatas-2026-v1.10.apk
            /tmp/BabaEllatas-v1.10.sha256
          if-no-files-found: error
