let state={}, current='dash', selectedMuni=null;
function deepClone(x){return JSON.parse(JSON.stringify(x))}
function seed(){return deepClone(INITIAL_DATA)}
function load(){try{let old=JSON.parse(localStorage.getItem('ensa_demo_state'));if(!old||old.dataVersion!==DATA_VERSION){state=seed();localStorage.setItem('ensa_demo_state_backup_v'+(old?.dataVersion||'old'),JSON.stringify(old||{}));}else state=old;}catch(e){state=seed()} save()}
function save(){localStorage.setItem('ensa_demo_state',JSON.stringify(state))}
function login(){let e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;if(USERS[e]&&p===DEMO_PASS){sessionStorage.setItem('ensa_user',e);openApp()}else document.getElementById('loginError').textContent='Hibás e-mail vagy jelszó.'}
function openApp(){let e=sessionStorage.getItem('ensa_user');if(!e||!USERS[e])return;load();document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=USERS[e];go('dash')}
function logout(){sessionStorage.clear();document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('password').value=''}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return (n===null||n===undefined||n==='')?'—':new Intl.NumberFormat('hu-HU').format(Number(n))+' Ft'}
function allTasks(){return state.municipalities.flatMap(m=>m.tasks.map(t=>({...t,muni:m.name,mid:m.id})))}
function allGrants(){return state.municipalities.flatMap(m=>m.grants.map(g=>({...g,muni:m.name,mid:m.id})))}
function allPackages(){return state.municipalities.flatMap(m=>m.packages.map(p=>({...p,muni:m.name,mid:m.id})))}
function totals(){let ps=allPackages(),planned=ps.reduce((s,p)=>s+Number(p.planned||0),0),contracted=ps.reduce((s,p)=>s+Number((p.offers||[]).find(o=>o.selected)?.amount||0),0),actual=state.costs.reduce((s,c)=>s+Number(c.amount||0),0);return {planned,contracted,actual}}
function go(v){current=v;selectedMuni=null;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.v===v));document.getElementById('fab').classList.toggle('hidden',!['tasks','contractors'].includes(v));render()}
function render(){let el=document.getElementById('view');if(current==='dash')el.innerHTML=dashboard();if(current==='muni')el.innerHTML=muniList();if(current==='tasks')el.innerHTML=taskList();if(current==='contractors')el.innerHTML=contractorList();if(current==='budget')el.innerHTML=budget();}
function progressPct(m){return Math.round(((m.step+1)/steps.length)*100)}
function dashboard(){let t=allTasks(),g=allGrants(),q=allPackages().reduce((s,p)=>s+(p.offers||[]).length,0),x=totals();return `<div class="hero"><h2>ENSA projektkövetés</h2><p>Offline adatmigráció v4 · 2026-09-23 · levelezési státuszok + ellenőrzött nyilvános kapcsolatok</p></div><div class="grid"><div class="metric"><div class="n">${state.municipalities.length}</div><div class="l">önkormányzat</div></div><div class="metric"><div class="n">${t.filter(x=>!x.done).length}</div><div class="l">nyitott feladat</div></div><div class="metric"><div class="n">${g.length}</div><div class="l">EUCF nyomkövetés</div></div><div class="metric"><div class="n">${q}</div><div class="l">ajánlati esemény</div></div></div><div class="card"><h3>EUCF / 60 000 EUR előkészítés</h3><div class="pill warn">Hivatalos kiírással ellenőrizendő</div><p class="muted">A 60 000 EUR és Call 8 információ a belső ENSA levelezésből került át. Beadás előtt minden jogosultsági, határidő- és elszámolási feltételt a hivatalos felhívásból kell validálni.</p></div><div class="card"><h3>Települések állapota</h3><div class="list">${state.municipalities.map(m=>`<div class="item" onclick="openMuni('${m.id}')"><div class="row"><h4>${esc(m.name)}</h4><span class="pill">${m.step+1}/${steps.length}</span></div><div class="muted">${esc(steps[Math.min(m.step,steps.length-1)])}</div><div class="progress"><i style="width:${progressPct(m)}%"></i></div><div class="hint">${esc(m.statusNote||'')}</div></div>`).join('')}</div></div>`}
function muniList(){return `<div class="sectionTitle">Önkormányzatok</div><div class="list">${state.municipalities.map(m=>`<div class="item" onclick="openMuni('${m.id}')"><div class="row"><h4>${esc(m.name)}</h4><span class="pill ${m.step>=12?'ok':''}">${m.step+1}/${steps.length}</span></div><div class="muted">${m.tasks.filter(t=>!t.done).length} nyitott feladat · ${m.grants.length} pályázat · ${m.packages.length} munkacsomag</div><div class="progress"><i style="width:${progressPct(m)}%"></i></div></div>`).join('')}</div>`}
function openMuni(id){selectedMuni=id;current='detail';document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));renderDetail('overview')}
function renderDetail(tab){let m=state.municipalities.find(x=>x.id===selectedMuni);if(!m)return go('muni');let tabs=`<div class="toolbar"><button class="secondary" onclick="renderDetail('overview')">Áttekintés</button><button class="secondary" onclick="renderDetail('tasks')">Feladatok</button><button class="secondary" onclick="renderDetail('grants')">Pályázatok</button><button class="secondary" onclick="renderDetail('packages')">Kivitelezés</button><button class="secondary" onclick="renderDetail('mail')">Levelezés</button></div>`;let body='';
if(tab==='overview')body=`<div class="card"><h3>ENSA folyamat</h3><div class="hint">${esc(m.statusNote||'')}</div><div class="field"><label>Aktuális lépés</label><select onchange="setStep('${m.id}',this.value)">${steps.map((s,i)=>`<option value="${i}" ${m.step==i?'selected':''}>${i+1}. ${esc(s)}</option>`).join('')}</select></div><div class="progress"><i style="width:${progressPct(m)}%"></i></div></div><div class="card"><h3>Kapcsolattartók</h3>${m.contacts.length?m.contacts.map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="muted">${esc(c.role)}${c.email?' · '+esc(c.email):''}${c.phone?' · '+esc(c.phone):''}</div>${c.note?`<div class="hint">${esc(c.note)}</div>`:''}</div>`).join(''):`<div class="empty">Még nincs kapcsolattartó.</div>`}<button class="secondary" onclick="contactModal('${m.id}')">＋ Kapcsolattartó</button></div>`;
if(tab==='tasks')body=`<div class="row"><h3>Teljes ENSA feladatlista</h3><button class="secondary" onclick="taskModal('${m.id}')">＋ Új</button></div>${m.tasks.length?m.tasks.map((t,i)=>`<div class="item"><div class="row"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.due||'Nincs határidő')} · ${esc(t.owner||'Nincs felelős')}</div>${t.note?`<div class="muted">${esc(t.note)}</div>`:''}</div><button class="smallBtn" onclick="toggleTask('${m.id}',${i})">${t.done?'↩':'✓'}</button></div><span class="pill ${t.done?'ok':'warn'}">${t.done?'Kész / igazolt':'Nyitott / következő'}</span></div>`).join(''):`<div class="empty">Nincs feladat.</div>`}`;
if(tab==='grants')body=`<div class="row"><h3>Pályázatok</h3><button class="secondary" onclick="grantModal('${m.id}')">＋ Új</button></div>${m.grants.length?m.grants.map((g,i)=>`<div class="item"><div class="row"><b>${esc(g.name)}</b><span class="pill">${g.step+1}/${grantSteps.length}</span></div><div class="muted">${esc(grantSteps[g.step]||'')}</div><div class="progress"><i style="width:${((g.step+1)/grantSteps.length*100).toFixed(0)}%"></i></div>${g.note?`<div class="hint">${esc(g.note)}</div>`:''}<div style="margin-top:8px"><button class="smallBtn" onclick="advanceGrant('${m.id}',${i})">Következő lépés</button></div></div>`).join(''):`<div class="empty">Nincs pályázat.</div>`}`;
if(tab==='packages')body=`<div class="row"><h3>Tanulmány / kivitelezés</h3><button class="secondary" onclick="packageModal('${m.id}')">＋ Munkacsomag</button></div>${m.packages.length?m.packages.map((p,i)=>packageCard(m,p,i)).join(''):`<div class="empty">Még nincs munkacsomag.</div>`}`;
if(tab==='mail')body=`<div class="card"><h3>E-mail események</h3><p class="muted">A levél törzsét nem tároljuk/megjelenítjük ezen a nézeten: csak státusz, dátum és rövid projektmetaadat látszik.</p><div class="row wrap"><button class="secondary" onclick="mailEvent('${m.id}','Kiküldve')">✓ Kiküldve</button><button class="secondary" onclick="mailEvent('${m.id}','Válasz érkezett')">↩ Válasz érkezett</button></div></div>${m.emails.length?m.emails.slice().reverse().map(e=>`<div class="item"><div class="row"><b>${esc(e.type)}</b><span class="pill ok">✓</span></div><div class="muted">${esc(e.time)}</div>${e.note?`<div class="hint">${esc(e.note)}</div>`:''}</div>`).join(''):`<div class="empty">Még nincs e-mail esemény.</div>`}`;
document.getElementById('view').innerHTML=`<button class="secondary" onclick="go('muni')">← Vissza</button><div class="sectionTitle" style="margin-top:14px">${esc(m.name)}</div>${tabs}${body}`}
function packageCard(m,p,i){let selected=(p.offers||[]).find(o=>o.selected);return `<div class="card"><div class="row"><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.area)} · ${esc(p.kind)}</div></div><span class="pill">${money(p.planned)}</span></div><div class="hr"></div><b>Ajánlatok / ajánlatkérések</b>${(p.offers||[]).length?p.offers.map((o,j)=>`<div class="item" style="margin-top:8px"><div class="row"><div><b>${esc(o.contractor)}</b><div class="muted">${money(o.amount)}${o.file?' · '+esc(o.file):''}</div>${o.status?`<div class="muted">${esc(o.status)}</div>`:''}</div><button class="smallBtn" onclick="selectOffer('${m.id}',${i},${j})">${o.selected?'★ Kiválasztva':'Kiválasztás'}</button></div></div>`).join(''):`<div class="muted" style="margin:8px 0">Nincs még ajánlat. Több összehasonlítható ajánlat tölthető fel.</div>`}<div class="row wrap" style="margin-top:10px"><button class="secondary" onclick="offerModal('${m.id}',${i})">＋ Ajánlat</button><button class="secondary" onclick="costModal('${m.id}',${i})">＋ Tényleges költség</button></div>${selected?`<div class="hint">Kiválasztott: <b>${esc(selected.contractor)}</b> · ${money(selected.amount)}</div>`:''}</div>`}
function taskList(){let arr=allTasks();return `<div class="sectionTitle">Feladatok</div><p class="muted">Az összes település teljes, sorrendbe rendezett ENSA-feladatlistája.</p>${arr.length?arr.map(t=>`<div class="item"><div class="row"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.muni)} · ${esc(t.due||'Nincs határidő')}</div>${t.note?`<div class="muted">${esc(t.note)}</div>`:''}</div><span class="pill ${t.done?'ok':'warn'}">${t.done?'Kész':'Nyitott'}</span></div></div>`).join(''):`<div class="empty">Nincs feladat.</div>`}`}
function contractorList(){return `<div class="sectionTitle">Kivitelezők és szakmai partnerek</div><p class="muted">A „potenciális” és „partner keresendő” rekord nem jelent odaítélt kivitelezési megbízást.</p>${state.contractors.length?state.contractors.map((c,i)=>`<div class="item"><div class="row"><div style="min-width:0"><h4>${esc(c.name)}</h4>${c.contact?`<div><b>${esc(c.contact)}</b>${c.role?' · '+esc(c.role):''}</div>`:''}<div>${(c.areas||[]).map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div><div class="muted">${esc(c.email||'')} ${c.phone?'· '+esc(c.phone):''}</div><div class="pill ${String(c.status||'').includes('beérkezett')?'ok':String(c.status||'').includes('keresendő')?'warn':''}">${esc(c.status||'')}</div>${c.note?`<div class="hint">${esc(c.note)}</div>`:''}</div><button class="smallBtn" onclick="deleteContractor(${i})">Törlés</button></div></div>`).join(''):`<div class="empty">Még nincs partner.</div>`}`}
function budget(){let x=totals(),ps=allPackages();return `<div class="sectionTitle">Költségvetés</div><div class="grid"><div class="metric"><div class="n" style="font-size:18px">${money(x.planned)}</div><div class="l">rögzített terv</div></div><div class="metric"><div class="n" style="font-size:18px">${money(x.contracted)}</div><div class="l">kiválasztott</div></div><div class="metric"><div class="n" style="font-size:18px">${money(x.actual)}</div><div class="l">tényleges</div></div><div class="metric"><div class="n" style="font-size:18px">${money(x.actual-x.planned)}</div><div class="l">eltérés</div></div></div><div class="hint">A migrált valós ajánlatoknál összeget csak akkor mutatunk, ha a konkrét árajánlatból ellenőrizve rögzítettük. A hiányzó összeg nem 0 Ft, hanem „—”.</div><div class="card"><h3>Önkormányzati bontás</h3>${state.municipalities.map(m=>{let pp=m.packages.reduce((s,p)=>s+Number(p.planned||0),0),cc=m.packages.reduce((s,p)=>s+Number((p.offers||[]).find(o=>o.selected)?.amount||0),0),aa=state.costs.filter(c=>c.mid===m.id).reduce((s,c)=>s+Number(c.amount||0),0);return `<div class="kpiLine"><span><b>${esc(m.name)}</b><br><span class="muted">terv ${money(pp||null)} · választott ${money(cc||null)}</span></span><span class="money">${money(aa||null)}</span></div>`}).join('')}</div><div class="card"><h3>Munkacsomagok</h3>${ps.length?ps.map(p=>`<div class="item"><b>${esc(p.muni)} · ${esc(p.name)}</b><div class="muted">${esc(p.area)} · terv: ${money(p.planned)}</div></div>`).join(''):`<div class="empty">Nincs még munkacsomag.</div>`}</div>`}
function setStep(mid,v){state.municipalities.find(m=>m.id===mid).step=Number(v);save();renderDetail('overview')}
function toggleTask(mid,i){let t=state.municipalities.find(m=>m.id===mid).tasks[i];t.done=!t.done;save();renderDetail('tasks')}
function advanceGrant(mid,i){let g=state.municipalities.find(m=>m.id===mid).grants[i];g.step=Math.min(grantSteps.length-1,g.step+1);save();renderDetail('grants')}
function mailEvent(mid,type){state.municipalities.find(m=>m.id===mid).emails.push({type,time:new Date().toLocaleString('hu-HU'),note:'Kézzel rögzített offline esemény'});save();renderDetail('mail')}
function selectOffer(mid,pi,oi){let p=state.municipalities.find(m=>m.id===mid).packages[pi];p.offers.forEach((o,j)=>o.selected=j===oi);save();renderDetail('packages')}
function deleteContractor(i){if(confirm('Törlöd ezt a partnert a DEMO adatbázisból?')){state.contractors.splice(i,1);save();render()}}
function showModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function taskModal(mid){showModal('Új feladat',`<div class="field"><label>Önkormányzat</label><select id="f_mid">${state.municipalities.map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Feladat</label><input id="f_title"></div><div class="field"><label>Felelős</label><input id="f_owner"></div><div class="field"><label>Határidő</label><input id="f_due" type="date"></div><button class="primary" onclick="addTask()">Mentés</button>`)}
function addTask(){let m=state.municipalities.find(x=>x.id===document.getElementById('f_mid').value);m.tasks.push({title:document.getElementById('f_title').value||'Új feladat',owner:document.getElementById('f_owner').value,due:document.getElementById('f_due').value,done:false,note:'Kézzel hozzáadott feladat'});save();closeModal();if(current==='detail')renderDetail('tasks');else render()}
function contactModal(mid){showModal('Kapcsolattartó',`<input type="hidden" id="c_mid" value="${mid}"><div class="field"><label>Név</label><input id="c_name"></div><div class="field"><label>Beosztás</label><input id="c_role"></div><div class="field"><label>E-mail</label><input id="c_email" type="email"></div><div class="field"><label>Telefon</label><input id="c_phone"></div><button class="primary" onclick="addContact()">Mentés</button>`)}
function addContact(){let m=state.municipalities.find(x=>x.id===document.getElementById('c_mid').value);m.contacts.push({name:document.getElementById('c_name').value||'Kapcsolattartó',role:document.getElementById('c_role').value,email:document.getElementById('c_email').value,phone:document.getElementById('c_phone').value,note:'Kézzel hozzáadott kapcsolat'});save();closeModal();renderDetail('overview')}
function grantModal(mid){showModal('Új pályázat',`<input type="hidden" id="g_mid" value="${mid}"><div class="field"><label>Pályázat neve</label><input id="g_name" placeholder="pl. EUCF Call 8"></div><button class="primary" onclick="addGrant()">Mentés</button>`)}
function addGrant(){let m=state.municipalities.find(x=>x.id===document.getElementById('g_mid').value);m.grants.push({name:document.getElementById('g_name').value||'Új pályázat',step:0,note:''});save();closeModal();renderDetail('grants')}
function contractorModal(){showModal('Új kivitelező / partner',`<div class="field"><label>Cégnév</label><input id="k_name"></div><div class="field"><label>Kapcsolattartó</label><input id="k_contact"></div><div class="field"><label>Szakterületek</label><input id="k_areas" placeholder="tanulmány, napelem, szélenergia..."></div><div class="field"><label>E-mail</label><input id="k_email" type="email"></div><div class="field"><label>Telefon</label><input id="k_phone"></div><button class="primary" onclick="addContractor()">Mentés</button>`)}
function addContractor(){state.contractors.push({name:document.getElementById('k_name').value||'Új kivitelező',contact:document.getElementById('k_contact').value,role:'',areas:document.getElementById('k_areas').value.split(',').map(x=>x.trim()).filter(Boolean),email:document.getElementById('k_email').value,phone:document.getElementById('k_phone').value,status:'Kézzel felvett',note:''});save();closeModal();render()}
function packageModal(mid){showModal('Új munkacsomag',`<input type="hidden" id="p_mid" value="${mid}"><div class="field"><label>Megnevezés</label><input id="p_name" placeholder="pl. Energetikai tanulmány"></div><div class="field"><label>Típus</label><select id="p_kind"><option>Tanulmány</option><option>Kivitelezés</option></select></div><div class="field"><label>Terület</label><select id="p_area"><option>Tanulmánykészítés</option><option>Napelem</option><option>Szélenergia</option><option>Energiatárolás / BESS</option><option>EMS / AI</option><option>Geotermia</option><option>Zöldhidrogén / tárolás</option><option>Szenzorika / monitoring</option><option>Villamos kivitelezés</option><option>Egyéb</option></select></div><div class="field"><label>Tanulmány szerinti / tervezett költség (Ft)</label><input id="p_planned" type="number" min="0"></div><button class="primary" onclick="addPackage()">Mentés</button>`)}
function addPackage(){let m=state.municipalities.find(x=>x.id===document.getElementById('p_mid').value);let v=document.getElementById('p_planned').value;m.packages.push({name:document.getElementById('p_name').value||'Új munkacsomag',kind:document.getElementById('p_kind').value,area:document.getElementById('p_area').value,planned:v===''?null:Number(v),offers:[]});save();closeModal();renderDetail('packages')}
function offerModal(mid,pi){let opts=state.contractors.length?state.contractors.map(c=>`<option>${esc(c.name)}</option>`).join(''):`<option>Még nincs kivitelező a törzsben</option>`;showModal('Új árajánlat',`<input type="hidden" id="o_mid" value="${mid}"><input type="hidden" id="o_pi" value="${pi}"><div class="field"><label>Kivitelező</label><select id="o_contractor">${opts}</select></div><div class="field"><label>Ajánlati összeg (Ft)</label><input id="o_amount" type="number" min="0"></div><div class="field"><label>Dokumentum megnevezése</label><input id="o_file" placeholder="pl. ajanlat_2026.pdf"></div><button class="primary" onclick="addOffer()">Mentés</button>`)}
function addOffer(){let m=state.municipalities.find(x=>x.id===document.getElementById('o_mid').value),p=m.packages[Number(document.getElementById('o_pi').value)],v=document.getElementById('o_amount').value;p.offers.push({contractor:document.getElementById('o_contractor').value,amount:v===''?null:Number(v),file:document.getElementById('o_file').value,selected:false,status:'Kézzel rögzített ajánlat'});save();closeModal();renderDetail('packages')}
function costModal(mid,pi){showModal('Tényleges költség',`<input type="hidden" id="x_mid" value="${mid}"><input type="hidden" id="x_pi" value="${pi}"><div class="field"><label>Megnevezés</label><input id="x_name" placeholder="pl. kivitelezési számla"></div><div class="field"><label>Összeg (Ft)</label><input id="x_amount" type="number" min="0"></div><button class="primary" onclick="addCost()">Mentés</button>`)}
function addCost(){let mid=document.getElementById('x_mid').value,pi=Number(document.getElementById('x_pi').value),p=state.municipalities.find(m=>m.id===mid).packages[pi];state.costs.push({mid,packageName:p.name,name:document.getElementById('x_name').value||'Tényleges költség',amount:Number(document.getElementById('x_amount').value||0),time:new Date().toISOString()});save();closeModal();renderDetail('packages')}
function fabAction(){if(current==='tasks')taskModal(state.municipalities[0].id);else if(current==='contractors')contractorModal()}
window.addEventListener('load',()=>{if(sessionStorage.getItem('ensa_user'))openApp()});
</script></body></html>
