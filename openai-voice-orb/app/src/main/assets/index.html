<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060816"><title>OpenAI Voice Orb</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060816;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh;display:flex;justify-content:center}.wrap{width:min(100%,560px);min-height:100vh;padding:28px 20px 34px;display:flex;flex-direction:column;align-items:center}h1{margin:8px 0 4px;font-size:24px}.sub{color:#aab4d2;font-size:14px;text-align:center;margin:0 0 18px}.orb-wrap{height:310px;width:100%;display:grid;place-items:center}.orb{--level:0;width:174px;height:174px;border-radius:50%;position:relative;background:radial-gradient(circle at 34% 28%,#e7fdff 0 4%,#92edff 10%,#7c82ff 34%,#5633c7 58%,#0d103b 76%,#060816 100%);box-shadow:0 0 calc(32px + var(--level)*60px) rgba(114,119,255,.65),inset 0 0 38px rgba(255,255,255,.2);transform:scale(calc(1 + var(--level)*.15));transition:.08s}.orb:before,.orb:after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(159,195,255,.3);animation:spin 5.2s linear infinite}.orb:after{inset:-30px;border-color:rgba(106,91,255,.18);animation-duration:7.7s;animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}.status{margin-top:-18px;min-height:22px;color:#b8c4e4;font-size:14px;text-align:center}.card{width:100%;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.055);padding:16px}label{display:block;font-size:12px;color:#aab4d2;margin:0 0 7px}input{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#0b1027;color:#fff;padding:13px 14px;font-size:15px;outline:none}.row{display:flex;gap:10px;margin-top:14px}button{flex:1;border:0;border-radius:13px;padding:13px 12px;font-size:15px;font-weight:700}#start{background:#f4f7ff;color:#0a0d1b}#stop{background:#2a3049;color:#fff}button:disabled{opacity:.45}.note{margin:13px 2px 0;color:#7f8bab;font-size:12px;line-height:1.45}.log{margin-top:12px;width:100%;max-height:100px;overflow:auto;font:11px/1.4 monospace;color:#8795ba;white-space:pre-wrap}
</style></head><body><div class="wrap"><h1>Voice Orb</h1><p class="sub">Valós idejű magyar hangbeszélgetés OpenAI Realtime API-val</p><div class="orb-wrap"><div id="orb" class="orb"></div></div><div id="status" class="status">Add meg az API-kulcsot, majd indítsd el.</div><div class="card"><label for="key">OpenAI API key — az app nem menti el</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..."><div class="row"><button id="start">Beszélgetés indítása</button><button id="stop" disabled>Leállítás</button></div><div class="note">Online demó. A kulcs csak az aktuális futás memóriájában marad.</div><div id="log" class="log"></div></div></div><audio id="remoteAudio" autoplay></audio>
<script>
let pc=null,dc=null,micStream=null,ctx=null,analyser=null,raf=0;const $=id=>document.getElementById(id),orb=$('orb'),statusEl=$('status'),logEl=$('log');
function setStatus(s){statusEl.textContent=s}function log(s){const t=new Date().toLocaleTimeString();logEl.textContent=`${t}  ${s}\n`+logEl.textContent.slice(0,2600)}
function meter(){if(!analyser)return;const data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);let sum=0;for(const x of data){const v=(x-128)/128;sum+=v*v}const rms=Math.sqrt(sum/data.length),level=Math.min(1,Math.max(0,(rms-.018)*8));orb.style.setProperty('--level',level.toFixed(3));raf=requestAnimationFrame(meter)}
async function start(){const apiKey=$('key').value.trim();if(!apiKey){setStatus('Hiányzik az API-kulcs.');return}$('start').disabled=true;setStatus('Mikrofon indítása…');try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});ctx=new(window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaStreamSource(micStream);analyser=ctx.createAnalyser();analyser.fftSize=256;src.connect(analyser);meter();pc=new RTCPeerConnection();pc.ontrack=e=>{$('remoteAudio').srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{if(!pc)return;log('WebRTC: '+pc.connectionState);if(pc.connectionState==='connected')setStatus('Kapcsolódva – beszélj nyugodtan.');if(['failed','disconnected','closed'].includes(pc.connectionState))setStatus('A kapcsolat megszakadt.')};micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>log('Adatcsatorna megnyílt.');dc.onmessage=e=>{try{const ev=JSON.parse(e.data);if(ev.type==='error')log('API hiba: '+JSON.stringify(ev.error||ev));else if(ev.type?.includes('speech_started'))setStatus('Hallgatlak…');else if(ev.type?.includes('speech_stopped'))setStatus('Gondolkodom…');else if(ev.type?.includes('response.done'))setStatus('Beszélhetsz tovább.')}catch(_){}};const offer=await pc.createOffer();await pc.setLocalDescription(offer);setStatus('Kapcsolódás az OpenAI-hoz…');const session={type:'realtime',model:'gpt-realtime-2.1',instructions:'Beszélj természetesen, röviden és segítőkészen magyar nyelven. Folyamatos, párbeszédszerű hangbeszélgetést folytatsz a felhasználóval.',output_modalities:['audio']};const form=new FormData();form.append('sdp',new Blob([offer.sdp],{type:'application/sdp'}),'offer.sdp');form.append('session',new Blob([JSON.stringify(session)],{type:'application/json'}),'session.json');const r=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',headers:{Authorization:'Bearer '+apiKey},body:form});if(!r.ok)throw new Error(`OpenAI ${r.status}: ${await r.text()}`);const answerSdp=await r.text();await pc.setRemoteDescription({type:'answer',sdp:answerSdp});$('stop').disabled=false;setStatus('Kapcsolódás…')}catch(err){log(String(err));setStatus('Hiba: '+(err?.message||err));stop(true)}}
function stop(keepError=false){cancelAnimationFrame(raf);analyser=null;if(dc){try{dc.close()}catch(_){}dc=null}if(pc){try{pc.close()}catch(_){}pc=null}if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}if(ctx){try{ctx.close()}catch(_){}ctx=null}$('remoteAudio').srcObject=null;orb.style.setProperty('--level','0');$('start').disabled=false;$('stop').disabled=true;if(!keepError)setStatus('Leállítva.')}
$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>stop(false));window.addEventListener('beforeunload',()=>stop(false));
</script></body></html>
